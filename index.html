<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUAUTO | Inventory Ops</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --border: #334155;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px;
            line-height: 1.5;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            margin-bottom: 30px; 
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }
        .brand h1 { margin: 0; font-size: 24px; letter-spacing: -0.025em; font-weight: 800; color: var(--text-main); }
        .brand span { color: var(--accent); }
        .status-bar { text-align: right; font-size: 12px; color: var(--text-dim); }
        .status-pill { 
            display: inline-flex; 
            align-items: center; 
            padding: 2px 8px; 
            border-radius: 12px; 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 10px;
            margin-left: 10px;
        }
        .status-fresh { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .status-stale { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-error { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .metrics-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 15px; 
            margin-bottom: 30px; 
        }
        .metric-card { 
            background: var(--card-bg); 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            text-align: center;
            transition: var(--transition);
        }
        .metric-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .metric-card .label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 600; margin-bottom: 5px; }
        .metric-card .value { font-size: 20px; font-weight: 700; color: var(--text-main); }

        .controls { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 12px; 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            margin-bottom: 30px; 
            position: sticky;
            top: 20px;
            z-index: 10;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
        }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; }
        .filter-group input, .filter-group select { 
            background: var(--bg); 
            color: var(--text-main); 
            border: 1px solid var(--border); 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 14px;
            transition: var(--transition);
        }
        .filter-group input:focus, .filter-group select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

        .quick-filters { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            margin-bottom: 30px; 
        }
        .qf-btn { 
            background: var(--card-bg); 
            color: var(--text-dim); 
            border: 1px solid var(--border); 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            cursor: pointer; 
            transition: var(--transition); 
        }
        .qf-btn:hover { color: var(--text-main); border-color: var(--text-dim); }
        .qf-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }

        .inventory { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 24px; 
        }
        .card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            overflow: hidden; 
            transition: var(--transition); 
            display: flex; 
            flex-direction: column;
            position: relative;
        }
        .card:hover { 
            transform: translateY(-4px); 
            border-color: var(--accent); 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); 
        }
        .card-img { 
            width: 100%; 
            aspect-ratio: 4/3; 
            object-fit: cover; 
            background: #000;
            border-bottom: 1px solid var(--border);
        }
        .card-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--text-main); line-height: 1.2; }
        .card-source { 
            font-size: 10px; 
            padding: 2px 6px; 
            border-radius: 4px; 
            background: var(--border); 
            color: var(--text-dim); 
            text-transform: uppercase; 
            font-weight: 700; 
        }
        .card-details { font-size: 13px; color: var(--text-dim); margin-bottom: 15px; }
        .card-details b { color: var(--text-main); }
        .card-price { 
            font-size: 24px; 
            font-weight: 800; 
            color: var(--accent); 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: baseline;
        }
        .card-price span { font-size: 14px; color: var(--text-dim); font-weight: 400; }
        
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
        .btn { 
            padding: 10px; 
            border-radius: 8px; 
            text-align: center; 
            text-decoration: none; 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: var(--transition);
            border: none;
        }
        .btn-primary { background: var(--accent); color: var(--bg); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: #475569; }

        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); 
            display: none; justify-content: center; align-items: center; z-index: 100; 
            transition: var(--transition);
        }
        .modal { 
            background: var(--card-bg); 
            width: 90%; max-width: 600px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            padding: 30px; 
            position: relative; 
            animation: modalIn 0.2s ease-out;
        }
        @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 24px; }
        
        .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .calc-result { 
            background: var(--bg); 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1px solid var(--accent); 
        }
        .calc-result .amount { font-size: 32px; font-weight: 800; color: var(--accent); display: block; }

        .compare-panel {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--card-bg); border: 1px solid var(--accent);
            padding: 15px 25px; border-radius: 50px; display: none;
            align-items: center; gap: 20px; z-index: 90; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .status-bar { text-align: left; }
            .controls { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">
                <h1>TRUAUTO <span>INVENTORY OPS</span></h1>
            </div>
            <div class="status-bar">
                LAST UPDATED: <span id="last-updated">...</span>
                <span id="source-status" class="status-pill">CHECKING</span>
            </div>
        </div>

        <div class="metrics-grid" id="metrics"></div>

        <div class="controls">
            <div class="filter-group">
                <label>Global Search</label>
                <input type="text" id="search" placeholder="VIN, Stock, Model...">
            </div>
            <div class="filter-group">
                <label>Make</label>
                <select id="make"></select>
            </div>
            <div class="filter-group">
                <label>Location</label>
                <select id="location"></select>
            </div>
            <div class="filter-group">
                <label>Source</label>
                <select id="source"></select>
            </div>
            <div class="filter-group">
                <label>Max Price</label>
                <input type="number" id="price" placeholder="Any">
            </div>
            <div class="filter-group">
                <label>Max Mileage</label>
                <input type="number" id="mileage" placeholder="Any">
            </div>
            <div class="filter-group">
                <label>Min Year</label>
                <input type="number" id="year" placeholder="Any">
            </div>
            <div class="filter-group">
                <label>Sort</label>
                <select id="sort">
                    <option value="year_desc">Year (Newest)</option>
                    <option value="price_asc">Price (Lowest)</option>
                    <option value="price_desc">Price (Highest)</option>
                    <option value="mileage_asc">Mileage (Lowest)</option>
                </select>
            </div>
        </div>

        <div class="quick-filters" id="quick-filters"></div>

        <div class="inventory" id="inventory"></div>
    </div>

    <div class="compare-panel" id="compare-panel">
        <span id="compare-count">0 vehicles selected</span>
        <button class="btn btn-primary" onclick="openCompare()">Compare Now</button>
        <button class="btn btn-secondary" onclick="clearCompare()">Clear</button>
    </div>

    <div class="overlay" id="payment-overlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">×</button>
            <h2 style="margin-top:0">Payment Estimator</h2>
            <div class="calc-grid">
                <div class="filter-group">
                    <label>Down Payment ($)</label>
                    <input type="number" id="calc-down" value="2000">
                </div>
                <div class="filter-group">
                    <label>APR (%)</label>
                    <input type="number" id="calc-apr" value="5.9" step="0.1">
                </div>
                <div class="filter-group">
                    <label>Term (Months)</label>
                    <input type="number" id="calc-term" value="60">
                </div>
                <div class="filter-group">
                    <label>Vehicle Price</label>
                    <input type="number" id="calc-price" readonly>
                </div>
            </div>
            <div class="calc-result">
                <span class="label">ESTIMATED MONTHLY</span>
                <span class="amount" id="calc-monthly">$0</span>
                <span style="font-size: 10px; color: var(--text-dim); display: block; margin-top: 10px;">
                    ESTIMATE ONLY — NOT A CREDIT OFFER
                </span>
            </div>
        </div>
    </div>

    <div class="overlay" id="compare-overlay">
        <div class="modal" style="max-width: 800px;">
            <button class="modal-close" onclick="closeModal()">×</button>
            <h2 style="margin-top:0">Vehicle Comparison</h2>
            <div id="compare-table-container" style="overflow-x: auto;"></div>
        </div>
    </div>

            const sort = document.getElementById('sort').value;

            let filtered = data.filter(v => {
                const matchesSearch = !search || JSON.stringify(v).toLowerCase().includes(search);
                const matchesMake = !make || v.make === make;
                const matchesLoc = !loc || v.location === loc;
                const matchesSrc = !src || v.source === src;
                const matchesPrice = v.price <= price;
                const matchesMileage = v.mileage <= mileage;
                const matchesYear = v.year >= year;
                const matchesQF = !activeQF || activeQF.filter(v);
                return matchesSearch && matchesMake && matchesLoc && matchesSrc && matchesPrice && matchesMileage && matchesYear && matchesQF;
            });

            filtered.sort((a, b) => {
                if (sort === 'year_desc') return b.year - a.year;
                if (sort === 'price_asc') return a.price - b.price;
                if (sort === 'price_desc') return b.price - a.price;
                if (sort === 'mileage_asc') return a.mileage - b.mileage;
                return 0;
            });

            const container = document.getElementById('inventory');
            container.innerHTML = filtered.map(v => {
                const payment = calculatePayment(v.price, 2000, 5.9, 60);
                return '<div class="card">' + 
                    (v.inTransit ? '<div class="badge transit">In Transit</div>' : '') + 
                    '<img src="' + (v.image || 'https://via.placeholder.com/400x300?text=No+Image') + '" class="card-img" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Error'">' +
                    '<div class="card-content">' +
                        '<div class="card-top">' +
                            '<h3 class="card-title">' + v.year + ' ' + v.make + ' ' + v.model + '</h3>' +
                            '<span class="card-source">' + v.source + '</span>' +
                        '</div>' +
                        '<div class="card-details">' +
                            '<b>VIN:</b> ' + (v.vin || 'N/A') + '<br>' +
                            '<b>Stock:</b> ' + (v.stock || 'N/A') + '<br>' +
                            '<b>Miles:</b> ' + v.mileage.toLocaleString() + '<br>' +
                            '<b>Loc:</b> ' + v.location +
                        '</div>' +
                        '<div class="card-price">' + 
                            '$' + v.price.toLocaleString() + 
                            '<span>Est. ' + payment + '/mo</span>' +
                        '</div>' +
                        '<div class="card-actions">' +
                            '<button class="btn btn-secondary" onclick="toggleCompare('' + (v.vin || v.stock) + '')">Compare</button>' +
                            '<button class="btn btn-primary" onclick="openPayment(' + v.price + ', '' + (v.vin || v.stock) + '')">Payment</button>' +
                            '<button class="btn btn-secondary" onclick="copyVehicle('' + btoa(JSON.stringify(v)) + '')">Share</button>' +
                            '<a href="' + v.url + '" target="_blank" class="btn btn-primary" style="text-align:center">View Site</a>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function calculatePayment(price, down, apr, term) {
            if (!price || price === 0) return 'N/A';
            const principal = price - down;
            if (principal <= 0) return 'Paid';
            const monthlyRate = (apr / 100) / 12;
            const payment = (principal * monthlyRate) / (1 - Math.pow(1 + monthlyRate, -term));
            return '$' + Math.round(payment);
        }

        function openPayment(price, id) {
            document.getElementById('calc-price').value = price;
            document.getElementById('payment-overlay').style.display = 'flex';
            updatePaymentCalc();
        }

        function updatePaymentCalc() {
            const price = parseInt(document.getElementById('calc-price').value) || 0;
            const down = parseInt(document.getElementById('calc-down').value) || 0;
            const apr = parseFloat(document.getElementById('calc-apr').value) || 0;
            const term = parseInt(document.getElementById('calc-term').value) || 0;
            document.getElementById('calc-monthly').innerText = calculatePayment(price, down, apr, term);
        }

        function copyVehicle(encoded) {
            const v = JSON.parse(atob(encoded));
            const text = v.year + ' ' + v.make + ' ' + v.model + '\n$' + v.price.toLocaleString() + '\n' + v.mileage.toLocaleString() + ' miles\nStock ' + v.stock + '\n' + v.location + '\n' + v.url;
            navigator.clipboard.writeText(text);
            alert('Vehicle details copied to clipboard!');
        }

        function toggleCompare(id) {
            if (compareList.has(id)) compareList.delete(id);
            else if (compareList.size < 4) compareList.add(id);
            else alert('Max 4 vehicles for comparison');
            
            const panel = document.getElementById('compare-panel');
            panel.style.display = compareList.size > 0 ? 'flex' : 'none';
            document.getElementById('compare-count').innerText = compareList.size + ' vehicles selected';
        }

        function clearCompare() {
            compareList.clear();
            document.getElementById('compare-panel').style.display = 'none';
        }

        function openCompare() {
            const selected = data.filter(v => compareList.has(v.vin || v.stock));
            const container = document.getElementById('compare-table-container');
            
            let html = '<table style="width:100%; border-collapse: collapse; color: var(--text-main); font-size: 14px;">';
            html += '<thead><tr style="text-align:left; border-bottom: 2px solid var(--border);">';
            html += '<th style="padding:10px">Feature</th>';
            selected.forEach(v => html += '<th style="padding:10px">' + v.year + ' ' + v.make + '</th>');
            html += '</tr></thead><tbody>';
            
            const rows = [
                { label: 'Price', key: 'price', format: v => '$' + v.price.toLocaleString(), highlight: 'min' },
                { label: 'Mileage', key: 'mileage', format: v => v.mileage.toLocaleString(), highlight: 'min' },
                { label: 'Year', key: 'year', format: v => v.year, highlight: 'max' },
                { label: 'Location', key: 'location', format: v => v.location },
                { label: 'Source', key: 'source', format: v => v.source },
            ];

            rows.forEach(row => {
                html += '<tr style="border-bottom: 1px solid var(--border);">';
                html += '<td style="padding:10px; font-weight:bold; color:var(--text-dim)">' + row.label + '</td>';
                
                const values = selected.map(v => v[row.key]);
                const bestValue = row.highlight === 'min' ? Math.min(...values) : Math.max(...values);
                
                selected.forEach(v => {
                    const isBest = row.highlight && v[row.key] === bestValue;
                    html += '<td style="padding:10px; color:' + (isBest ? 'var(--success)' : 'inherit') + '"' + (isBest ? ' style="font-weight:bold"' : '') + '>' + row.format(v) + '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;
            document.getElementById('compare-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');
        }

        document.querySelectorAll('#payment-overlay input').forEach(i => i.addEventListener('input', updatePaymentCalc));
        document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', render));
        
        updateMetrics();
        render();
    </script>
</body>
</html>
